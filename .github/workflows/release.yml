name: release
run-name: release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (for example 0.2.0)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      tagged: ${{ steps.tag.outputs.tagged }}
      image: ${{ steps.check.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the version
        id: check
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 .github/bump-version.py --check-next "$RELEASE_VERSION"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Write it into the project
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/bump-version.py "$RELEASE_VERSION"

      - name: Tag the release
        id: tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="v$RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No version change to commit"
          else
            git commit -m "chore(release): $version"
          fi

          git tag -a "$version" -m "$version - Twitch Miner"
          # ! Only the tag is pushed: the release commit stays off `main` on purpose.
          git push origin "refs/tags/$version"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

  publish:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux (AppImage, deb, rpm)"
            platform: ubuntu-22.04
            args: --bundles appimage,rpm,deb -- --locked
            # ! No "linux" in the name: every AppImage is for Linux, and AppImage tools
            # warn about a name that says so.
            assets: "twitch-miner_[version]_[arch][setup][ext]"
          - name: "Windows (installer, portable)"
            platform: windows-latest
            args: --bundles nsis -- --locked
            assets: "twitch-miner_[version]_[platform]_[arch][setup][ext]"
          - name: "macOS (dmg, app)"
            platform: macos-latest
            # ! The macOS updater installs the signed `.app.tar.gz` that only the `app`
            # bundle produces.
            args: --bundles app,dmg --target universal-apple-darwin -- --locked
            assets: "twitch-miner_[version]_[platform]_[arch][setup][ext]"
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Install WebKitGTK and packaging tools
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm file

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install the interface dependencies
        run: npm ci

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.version.outputs.version }}
          releaseName: "v${{ needs.version.outputs.version }} - Twitch Miner"
          releaseBody: "Download the installer for your system, or run the Docker image ${{ needs.version.outputs.image }}:${{ needs.version.outputs.version }} (also tagged latest) on a home server. macOS builds are not notarized: the first time, open the app, then allow it in System Settings › Privacy & Security › Open Anyway. TwitchMiner-portable.exe runs on Windows without installing; it updates itself like the other builds."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          # ! latest.json already carries every signature: the .sig files are not published.
          uploadUpdaterSignatures: false
          # ! A fixed file name without the product name's "&": GitHub drops it from
          # asset names but tauri-action does not, so it would not find the signatures
          # and would skip latest.json.
          releaseAssetNamePattern: ${{ matrix.assets }}
          args: ${{ matrix.args }}

      - name: Attach the portable Windows executable
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/release/twitchminer.exe TwitchMiner-portable.exe
          gh release upload "v${{ needs.version.outputs.version }}" TwitchMiner-portable.exe --clobber

  # ! Only the versioned image here: `latest` moves in `finalize`, once the
  # release is out, so a withdrawn run never moves it.
  docker:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.version.outputs.image }}:${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  finalize:
    needs: [version, publish, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ! tauri-action points latest.json at API URLs limited to 60 requests an hour per IP, and
      # the NSIS-only manifest has no entry a portable Windows copy could self-update from: both
      # are fixed here, before the release goes public.
      - name: Point latest.json at the public downloads and sign the portable copy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          tag="v$RELEASE_VERSION"
          base="https://github.com/$GH_REPO/releases/download/$tag"
          gh release download "$tag" --pattern latest.json --pattern TwitchMiner-portable.exe --dir draft
          gh release view "$tag" --json assets \
            --jq '[.assets[] | {key: (.apiUrl | split("/") | last), value: .name}] | from_entries' \
            > draft/names.json
          jq --slurpfile names draft/names.json --arg base "$base/" \
            '.platforms |= map_values(.url = ($base + ($names[0][.url | split("/") | last] // error("no asset for " + .url))))' \
            draft/latest.json > draft/rewritten.json

          # ! The portable copy ships no Tauri bundle the CLI signs on its own during `publish`:
          # it is signed here instead, against the same version, so the app can verify it like
          # every other platform. `--app-version` is what `requireSignedVersion` checks against.
          cli_version="$(jq -r '.packages["node_modules/@tauri-apps/cli"].version' package-lock.json)"
          npx --yes "@tauri-apps/cli@$cli_version" signer sign --app-version "$RELEASE_VERSION" draft/TwitchMiner-portable.exe
          jq --arg url "$base/TwitchMiner-portable.exe" \
            --arg signature "$(cat draft/TwitchMiner-portable.exe.sig)" \
            '.platforms["windows-x86_64-portable"] = {url: $url, signature: $signature}' \
            draft/rewritten.json > latest.json

          # ! The three builds rewrite latest.json in turn: one finishing at the same time as another can drop its system.
          jq -e '.platforms | has("linux-x86_64") and has("windows-x86_64") and has("windows-x86_64-portable") and has("darwin-aarch64") and has("darwin-x86_64")' latest.json > /dev/null \
            || { echo "::error::latest.json lacks a system: $(jq -c '.platforms | keys' latest.json)"; exit 1; }
          gh release upload "$tag" latest.json --clobber

      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: gh release edit "v$RELEASE_VERSION" --draft=false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image as latest
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$RELEASE_VERSION"

  # ! After a failed run start a NEW run: "Re-run failed jobs" would check out
  # the withdrawn tag and fail.
  withdraw:
    needs: [version, publish, docker, finalize]
    # ! Only a run that created its own tag may remove it: a refused version must
    # never delete the release already published under that number.
    if: (failure() || cancelled()) && needs.version.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove the tag and the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          draft="$(gh release view "v$RELEASE_VERSION" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          if [ "$draft" = "false" ]; then
            echo "v$RELEASE_VERSION is already published: nothing to withdraw"
            exit 0
          fi
          gh release delete "v$RELEASE_VERSION" --yes --cleanup-tag || true
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/v$RELEASE_VERSION" || true
