name: release
run-name: release v${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (for example 0.2.0)"
        required: true
        type: string
      notes:
        description: "Release notes in Markdown (## Features, ## Changes, ## Fixes…); several lines: gh workflow run release.yml -f notes=\"$(cat notes.md)\""
        required: true
        type: string
      dry_run:
        description: "Build every file from this branch as workflow artifacts only: no tag, release or image"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      ref: ${{ steps.check.outputs.ref }}
      tagged: ${{ steps.tag.outputs.tagged }}
      image: ${{ steps.check.outputs.image }}
    steps:
      - name: Check the notes
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "${RELEASE_NOTES//[[:space:]]/}" ]; then
            echo "::error::a release needs its notes"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ! A dry run builds the branch as it is: its files carry the version it declares.
      - name: Check the version
        id: check
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 .github/bump-version.py --check-next "$RELEASE_VERSION"
          if [ "$DRY_RUN" = "true" ]; then
            echo "version=$(python3 .github/bump-version.py --current)" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
            echo "ref=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Write it into the project
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/bump-version.py "$RELEASE_VERSION"

      - name: Tag the release
        id: tag
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="v$RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No version change to commit"
          else
            git commit -m "chore(release): $version"
          fi

          git tag -a "$version" -m "$version - Twitch Miner"
          # ! Only the tag is pushed: the release commit stays off `main` on purpose.
          git push origin "refs/tags/$version"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

  # ! No job restores a cache: a release builds from its source alone, and nothing another
  # run wrote can reach the signing key. The checks run beside the builds; `finalize` waits
  # for them before anything is made public.
  # ! The same checks `npm run verify` and `cargo clippy` run during
  # development (AGENTS.md), plus `cargo audit` and `npm audit`, on every
  # system the release builds for: a Rust warning or a known vulnerability
  # only on Windows or macOS must still block the release. An ARM64 build
  # compiles the same code as the x64 one of its system, so it adds no check here.
  checks:
    name: Checks (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            platform: ubuntu-22.04
          - name: Windows
            platform: windows-latest
          - name: macOS
            platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Install WebKitGTK and packaging tools
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm file

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          # ! A universal macOS binary is linked from both architectures.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the interface dependencies
        run: npm ci

      - name: Generate the interface messages
        run: npm run build

      - name: Check the interface
        run: npm run verify

      - name: Audit the npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check Rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit

  publish:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux x64 (AppImage, deb, rpm)"
            platform: ubuntu-22.04
            args: --bundles appimage,rpm,deb -- --locked
            assets: "twitch-miner_[arch][setup][ext]"
          # ! The same Ubuntu as x64, so both need the same glibc (2.35): Raspberry Pi OS
          # Bookworm and Debian 12 run them.
          - name: "Linux ARM64 (AppImage, deb, rpm)"
            platform: ubuntu-22.04-arm
            args: --bundles appimage,rpm,deb -- --locked
            assets: "twitch-miner_[arch][setup][ext]"
          - name: "Windows x64 (installer, portable)"
            platform: windows-latest
            args: --bundles nsis -- --locked
            assets: "twitch-miner_[platform]_[arch][setup][ext]"
            portable: twitch-miner_windows_x64_portable.exe
          - name: "Windows ARM64 (installer, portable)"
            platform: windows-11-arm
            args: --bundles nsis -- --locked
            assets: "twitch-miner_[platform]_[arch][setup][ext]"
            portable: twitch-miner_windows_arm64_portable.exe
          - name: "macOS (dmg, app)"
            platform: macos-latest
            # ! The macOS updater installs the signed `.app.tar.gz` that only the `app`
            # bundle produces.
            args: --bundles app,dmg --target universal-apple-darwin -- --locked
            assets: "twitch-miner_macos_[arch][setup][ext]"
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Install WebKitGTK and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm file

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the interface dependencies
        run: npm ci

      # ! Without a tag (dry run) tauri-action creates no release and uploads the files as
      # workflow artifacts, named like the release assets.
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ !inputs.dry_run && format('v{0}', needs.version.outputs.version) || '' }}
          releaseName: "v${{ needs.version.outputs.version }} - Twitch Miner"
          releaseBody: ${{ inputs.notes }}
          releaseDraft: true
          prerelease: false
          # ! The builds would each rewrite the shared latest.json and could drop each other's
          # systems: `finalize` writes it once, from the .sig files uploaded here, then deletes them.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          # ! A fixed file name without the product name's "&": GitHub drops it from
          # asset names but tauri-action does not. No version either, so the README links
          # to `releases/latest/download/<name>` always find the file.
          releaseAssetNamePattern: ${{ matrix.assets }}
          uploadWorkflowArtifacts: ${{ inputs.dry_run }}
          workflowArtifactNamePattern: ${{ matrix.assets }}
          args: ${{ matrix.args }}

      # ! Tauri names each Linux package after its own architecture name (`amd64`, `x86_64`,
      # `aarch64`, `arm64`): the release names them all `linux_x64`/`linux_arm64`, their
      # signatures too so `finalize` finds them beside them.
      - name: Name the Linux packages after their system
        if: ${{ !inputs.dry_run && runner.os == 'Linux' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=x64 froms="amd64.AppImage amd64.deb x86_64.rpm" ;;
            ARM64) arch=arm64 froms="aarch64.AppImage arm64.deb aarch64.rpm" ;;
            *) echo "::error::no Linux package name for $RUNNER_ARCH"; exit 1 ;;
          esac
          for from in $froms; do
            for suffix in "" .sig; do
              name="twitch-miner_$from$suffix"
              url="$(gh release view "v$RELEASE_VERSION" --json assets \
                --jq ".assets[] | select(.name == \"$name\") | .apiUrl")"
              : "${url:?the draft has no $name}"
              gh api --method PATCH "repos/$GH_REPO/releases/assets/${url##*/}" \
                -f name="twitch-miner_linux_$arch.${from#*.}$suffix" > /dev/null
            done
          done

      - name: Name the portable Windows executable
        if: matrix.portable
        shell: bash
        env:
          PORTABLE: ${{ matrix.portable }}
        run: cp target/release/twitchminer.exe "$PORTABLE"

      - name: Attach the portable Windows executable
        if: ${{ matrix.portable && !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTABLE: ${{ matrix.portable }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "v$RELEASE_VERSION" "$PORTABLE" --clobber

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.portable && inputs.dry_run }}
        with:
          name: ${{ matrix.portable }}
          path: ${{ matrix.portable }}
          if-no-files-found: error
          retention-days: 7

  # ! The image is pushed by digest only: `finalize` tags it once the checks pass, so a
  # withdrawn run never tags anything. A dry run pushes nothing.
  docker:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          # ! Its binfmt image cache is on by default: a release restores nothing another run wrote.
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ! One build for both: the image is pushed, and the server binary it runs is kept for
      # the release, one folder per platform (`linux_amd64`, `linux_arm64`). The Dockerfile
      # links it statically against musl, so it runs on any Linux of that architecture.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: |
            ${{ !inputs.dry_run && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', needs.version.outputs.image) || '' }}
            type=local,dest=server

      - name: Name the server binaries like the release assets
        run: |
          mkdir release
          install -m 755 server/linux_amd64/twitch-miner release/twitch-miner-server_linux_x64
          install -m 755 server/linux_arm64/twitch-miner release/twitch-miner-server_linux_arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twitch-miner-server_linux_x64
          path: release/twitch-miner-server_linux_x64
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twitch-miner-server_linux_arm64
          path: release/twitch-miner-server_linux_arm64
          if-no-files-found: error
          retention-days: 7

  dry-run:
    needs: [version, checks, publish, docker]
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: List the files a release would get
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # ! The Linux packages are only renamed on a real release's assets: normalize the
          # names here too, so a dry run lists the same files a release would get.
          names="$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].name' \
            | sed -E 's/^twitch-miner_(amd64|x86_64)\./twitch-miner_linux_x64./; s/^twitch-miner_(aarch64|arm64)\./twitch-miner_linux_arm64./' \
            | sort)"
          echo "$names"
          {
            echo "### Files a release would get"
            echo
            while read -r name; do echo "- \`$name\`"; done <<< "$names"
          } >> "$GITHUB_STEP_SUMMARY"

  finalize:
    needs: [version, checks, publish, docker]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: twitch-miner-server_*
          merge-multiple: true
          path: server

      # ! No latest.json entry: the server never replaces itself. Docker users pull the new
      # image; a systemd install replaces this file and restarts the service (README).
      - name: Attach the server binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "v$RELEASE_VERSION" --clobber server/*

      # ! The only writer of latest.json, once every build is in the draft: each entry points at
      # the public download (the API URLs are limited to 60 requests an hour per IP) and carries
      # the signature uploaded beside its file. A missing file or signature stops the release.
      - name: Write latest.json and sign the portable copies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          tag="v$RELEASE_VERSION"
          base="https://github.com/$GH_REPO/releases/download/$tag"
          macos="twitch-miner_macos_universal.app.tar.gz"
          # ! Each updater key and the asset it installs. The portable keys are the ones
          # `updates.rs` builds from its architecture.
          entries="
            linux-x86_64=twitch-miner_linux_x64.AppImage
            linux-x86_64-appimage=twitch-miner_linux_x64.AppImage
            linux-x86_64-deb=twitch-miner_linux_x64.deb
            linux-x86_64-rpm=twitch-miner_linux_x64.rpm
            linux-aarch64=twitch-miner_linux_arm64.AppImage
            linux-aarch64-appimage=twitch-miner_linux_arm64.AppImage
            linux-aarch64-deb=twitch-miner_linux_arm64.deb
            linux-aarch64-rpm=twitch-miner_linux_arm64.rpm
            windows-x86_64=twitch-miner_windows_x64-setup.exe
            windows-x86_64-nsis=twitch-miner_windows_x64-setup.exe
            windows-x86_64-portable=twitch-miner_windows_x64_portable.exe
            windows-aarch64=twitch-miner_windows_arm64-setup.exe
            windows-aarch64-nsis=twitch-miner_windows_arm64-setup.exe
            windows-aarch64-portable=twitch-miner_windows_arm64_portable.exe
            darwin-aarch64=$macos
            darwin-aarch64-app=$macos
            darwin-x86_64=$macos
            darwin-x86_64-app=$macos
            darwin-universal=$macos
            darwin-universal-app=$macos
          "
          portables="twitch-miner_windows_x64_portable.exe twitch-miner_windows_arm64_portable.exe"

          mkdir draft
          gh release view "$tag" --json assets --jq '.assets[].name' > draft/assets.txt
          gh release download "$tag" --pattern '*.sig' --dir draft

          # ! A portable copy ships no Tauri bundle the CLI signs on its own during `publish`:
          # each is signed here instead, against the same version, so the app can verify it like
          # every other platform. `--app-version` is what `requireSignedVersion` checks against.
          cli_version="$(jq -r '.packages["node_modules/@tauri-apps/cli"].version' package-lock.json)"
          for portable in $portables; do
            gh release download "$tag" --pattern "$portable" --dir draft
            npx --yes "@tauri-apps/cli@$cli_version" signer sign --app-version "$RELEASE_VERSION" "draft/$portable"
          done

          platforms='{}'
          for entry in $entries; do
            key="${entry%%=*}"
            asset="${entry#*=}"
            grep -qxF "$asset" draft/assets.txt || { echo "::error::the draft has no $asset for $key"; exit 1; }
            [ -s "draft/$asset.sig" ] || { echo "::error::$asset has no signature for $key"; exit 1; }
            platforms="$(jq --arg key "$key" --arg url "$base/$asset" --rawfile signature "draft/$asset.sig" \
              '.[$key] = {url: $url, signature: $signature}' <<< "$platforms")"
          done

          jq -n --arg version "$RELEASE_VERSION" \
            --arg notes "$(gh release view "$tag" --json body --jq .body)" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' > latest.json
          gh release upload "$tag" latest.json --clobber

          # ! The signatures now live in latest.json only: the release does not list them.
          grep '\.sig$' draft/assets.txt | while read -r signature; do
            gh release delete-asset "$tag" "$signature" --yes
          done

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ! The release text names the versioned image: it exists before the release goes public.
      - name: Tag the image with its version
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          DIGEST: ${{ needs.docker.outputs.digest }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: docker buildx imagetools create --tag "$IMAGE:$RELEASE_VERSION" "$IMAGE@${DIGEST:?docker pushed no digest}"

      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: gh release edit "v$RELEASE_VERSION" --draft=false

      - name: Tag the image as latest
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"

  # ! After a failed run start a NEW run: "Re-run failed jobs" would check out
  # the withdrawn tag and fail.
  withdraw:
    needs: [version, checks, publish, docker, finalize]
    # ! Only a run that created its own tag may remove it: a refused version must
    # never delete the release already published under that number. A dry run tags nothing.
    if: (failure() || cancelled()) && needs.version.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove the tag and the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          draft="$(gh release view "v$RELEASE_VERSION" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          if [ "$draft" = "false" ]; then
            echo "v$RELEASE_VERSION is already published: nothing to withdraw"
            exit 0
          fi
          gh release delete "v$RELEASE_VERSION" --yes --cleanup-tag || true
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/v$RELEASE_VERSION" || true
