events {}

http {
    server {
        listen 443 ssl;
        http2 on;
        server_name miner.example.com;

        ssl_certificate     /etc/nginx/certs/miner.example.com.crt;
        ssl_certificate_key /etc/nginx/certs/miner.example.com.key;

        location = /auth-check {
            internal;
            proxy_pass http://auth-service:9091/;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        # MINER_PASSWORD still works for scripts that sign in directly with
        # POST /api/auth, without a session from auth-service — never
        # through a browser. Everything else (including GET /api/auth, so
        # the dashboard itself can check its own signed-in state) goes
        # through auth_request below.
        location = /api/auth {
            set $bypass 0;
            if ($request_method = POST) { set $bypass 1; }
            if ($request_method = DELETE) { set $bypass 1; }
            if ($bypass = 1) { rewrite ^ /_internal/login-bypass last; }

            auth_request /auth-check;
            auth_request_set $auth_user $upstream_http_remote_user;

            proxy_set_header Remote-User $auth_user;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_pass http://miner:8080/api/auth;
        }

        location = /_internal/login-bypass {
            internal;
            # Never proxy a client's own Remote-User here: nothing strips
            # it for you by default, and this route has no auth_request to
            # overwrite it either.
            proxy_set_header Remote-User "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_pass http://miner:8080/api/auth;
        }

        location / {
            auth_request /auth-check;
            auth_request_set $auth_user $upstream_http_remote_user;

            # auth_request only validates — it never touches headers by
            # itself. Forgetting this line forwards a client's own
            # Remote-User unchanged, straight to the miner.
            proxy_set_header Remote-User $auth_user;
            # nginx does not forward the original Host by default (unlike
            # Traefik and Caddy): without this, Host becomes the upstream's
            # own address and the header is never trusted.
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_pass http://miner:8080;
        }
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }
}
