ServerRoot "/usr/local/apache2"
Listen 443

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

ServerName miner.example.com
ServerAdmin admin@miner.example.com

ErrorLog /proc/self/fd/2
LogLevel info
TransferLog /proc/self/fd/1

SSLSessionCache "shmcb:/tmp/ssl_scache(512000)"

<VirtualHost *:443>
    ServerName miner.example.com

    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/miner.example.com.crt
    SSLCertificateKeyFile /etc/apache2/certs/miner.example.com.key

    # Stock Apache ships no forward-auth subrequest module
    # (mod_auth_request is third-party), so this stack reverse-proxies
    # through "auth-gateway" instead, which validates the session and sets
    # Remote-User itself before forwarding on to the miner. Still strip any
    # client-sent Remote-User here too, defense-in-depth, before it ever
    # reaches auth-gateway.
    RequestHeader unset Remote-User

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # X-Forwarded-For: left to mod_proxy_http's own default behaviour
    # (ProxyAddHeaders On), which appends the real client address on its
    # own — a manual RequestHeader here using %{REMOTE_ADDR}e only works
    # once that variable is exported as an environment variable first, and
    # a config that gets it wrong silently prepends a broken "(null)," to
    # the header instead of failing loudly.

    ProxyPass        "/" "http://auth-gateway:9091/" upgrade=websocket
    ProxyPassReverse "/" "http://auth-gateway:9091/"
</VirtualHost>
