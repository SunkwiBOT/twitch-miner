global
    maxconn 100

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    # The miner's live-events channel is a long-lived WebSocket: a short
    # "server" timeout alone would cut it. "tunnel" applies once a
    # connection has switched protocols (a 101 response).
    timeout tunnel 1h

frontend fe_miner
    bind *:8443 ssl crt /etc/haproxy/certs/miner.example.com.pem

    # Nothing strips a client's own Remote-User by default: drop it
    # unconditionally before auth-gateway (which does the same again,
    # defense-in-depth) ever sees it.
    http-request del-header Remote-User

    http-request set-header X-Forwarded-Proto https
    # HAProxy does not set X-Forwarded-For on its own either.
    http-request set-header X-Forwarded-For %[src]

    default_backend be_auth_gateway

backend be_auth_gateway
    server auth-gateway 10.90.106.2:9091
