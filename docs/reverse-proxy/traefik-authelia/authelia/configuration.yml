---
theme: light
default_2fa_method: ""

server:
  address: "tcp://0.0.0.0:9091/"

log:
  level: info

identity_validation:
  reset_password:
    jwt_secret: "change-me-a-random-secret-at-least-20-characters"

authentication_backend:
  password_reset:
    disable: true
  file:
    path: /config/users_database.yml

access_control:
  default_policy: deny
  rules:
    - domain: "miner.example.com"
      policy: one_factor

session:
  secret: "change-me-another-random-secret-at-least-20-chars"
  cookies:
    - domain: "miner.example.com"
      authelia_url: "https://miner.example.com/"

regulation:
  max_retries: 5
  find_time: "2m"
  ban_time: "5m"

storage:
  encryption_key: "change-me-yet-another-random-secret-20-chars"
  local:
    path: /config/data/db.sqlite3

notifier:
  filesystem:
    filename: /config/data/notification.txt
