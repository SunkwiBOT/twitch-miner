[package]
name = "twitch-miner"
description = "Twitch Miner desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
miner-core = { workspace = true, features = ["notify-rust", "zbus"] }
chrono = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
auto-launch = "0.6"
tauri-plugin-updater = "2.14"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
dirs = { workspace = true }
base64 = { workspace = true }
# ! Same crate `tauri-plugin-updater` already uses internally to verify the installer
# artifacts: reused here to re-verify the portable executable before it replaces itself.
minisign-verify = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"
gio = "0.18"

[[bin]]
name = "twitchminer"
path = "src/main.rs"
